<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NutriScan - Indomaret Edition</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { primary: '#10b981' } } }
    }
  </script>
  <style>
    body { transition: background-color 0.3s, color 0.3s; }
    ::-webkit-scrollbar { display: none; }
    #reader { width: 100%; border-radius: 1rem; overflow: hidden; border: none !important; }
    #reader video { object-fit: cover; border-radius: 1rem; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-gray-900 dark:text-gray-100 pb-24">

  <!-- ================= LOGIN PAGE (Desain Baru ala Akun Google) ================= -->
  <div id="loginPage" class="fixed inset-0 z-[100] bg-white dark:bg-gray-900 flex flex-col items-center justify-center px-6 transition-opacity duration-500">
    <div class="bg-primary text-white p-4 rounded-2xl mb-4 shadow-lg">
      <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path></svg>
    </div>
    <h1 class="text-3xl font-bold text-primary mb-2">NutriScan</h1>
    <p class="text-gray-500 dark:text-gray-400 mb-8 text-center text-sm">Lacak nutrisi harianmu dari produk Indomaret dengan mudah.</p>
    
    <div class="w-full max-w-sm bg-gray-50 dark:bg-gray-800 p-6 rounded-3xl border dark:border-gray-700 shadow-sm text-left">
      <div class="flex items-center gap-2 mb-4 justify-center">
        <!-- Logo Google Buatan (Simbol G) -->
        <div class="w-8 h-8 rounded-full bg-white border dark:border-gray-600 flex items-center justify-center shadow-sm">
          <span class="font-bold text-blue-500 text-lg">G</span>
        </div>
        <h2 class="font-bold text-lg">Sign In Profil</h2>
      </div>
      
      <!-- Kolom Akun Google -->
      <div class="mb-4">
        <label class="block text-xs font-bold text-gray-500 dark:text-gray-400 mb-1 pl-1">Akun Google (Email)</label>
        <input type="email" id="loginEmail" placeholder="contoh@gmail.com" class="w-full border dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-primary text-sm">
      </div>
      
      <!-- Kolom Nama Panggilan -->
      <div class="mb-6">
        <label class="block text-xs font-bold text-gray-500 dark:text-gray-400 mb-1 pl-1">Nama Panggilan</label>
        <input type="text" id="loginName" placeholder="Masukkan nama panggilan..." class="w-full border dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-primary text-sm">
      </div>

      <button onclick="handleLogin()" class="w-full bg-primary text-white py-3 rounded-xl font-bold shadow-md active:scale-95 transition-transform">Lanjutkan</button>
      <p class="text-[10px] text-gray-400 text-center mt-4">Data tersimpan aman di perangkatmu.</p>
    </div>
  </div>

  <!-- ================= MAIN APP ================= -->
  <div id="mainApp" class="hidden opacity-0 transition-opacity duration-500">
    
    <header class="bg-white dark:bg-gray-800 shadow-sm sticky top-0 z-50">
      <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
        <div class="flex items-center gap-2">
          <!-- Avatar User -->
          <div class="w-9 h-9 bg-primary text-white rounded-full flex items-center justify-center font-bold text-base shadow-sm" id="avatarName">N</div>
          <div>
            <p class="text-[10px] text-gray-500 font-bold -mb-1">Halo,</p>
            <h1 class="font-bold text-base text-primary leading-tight" id="greetName">User</h1>
          </div>
        </div>
        <div class="flex items-center gap-3">
          <div class="flex items-center text-orange-500 font-bold bg-orange-100 dark:bg-gray-700 px-2 py-1 rounded-full text-sm shadow-inner">
            🔥 <span id="streakCount">0</span>
          </div>
          <button id="themeToggle" class="p-2 bg-gray-100 dark:bg-gray-700 rounded-full">🌙</button>
          <button onclick="handleLogout()" class="p-2 text-red-500 bg-red-50 dark:bg-gray-700 rounded-full" title="Keluar Akun">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
          </button>
        </div>
      </div>
    </header>

    <main class="max-w-md mx-auto px-4 mt-4 relative">

      <!-- HALAMAN 1: SCAN -->
      <section id="page-scan" class="page-section">
        <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border dark:border-gray-700 mb-4">
          <div class="flex justify-between items-center mb-3">
            <h2 class="font-bold text-lg">Pindai Barcode</h2>
            <button id="startCamBtn" onclick="startCamera()" class="bg-primary text-white px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1 shadow-md">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path></svg>
              Buka Kamera
            </button>
          </div>
          
          <div id="reader" class="hidden mb-3 bg-gray-100 dark:bg-gray-900 rounded-xl border border-dashed border-gray-300"></div>
          
          <div class="relative flex py-2 items-center">
            <div class="flex-grow border-t border-gray-300 dark:border-gray-600"></div>
            <span class="flex-shrink-0 mx-4 text-gray-400 text-xs">Atau ketik manual</span>
            <div class="flex-grow border-t border-gray-300 dark:border-gray-600"></div>
          </div>

          <div class="flex gap-2 mt-2">
            <input type="text" id="barcodeInput" placeholder="Ketik Kode / Nama..." class="flex-1 border dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-primary w-full text-sm">
            <button onclick="searchProduct()" class="bg-gray-200 dark:bg-gray-600 dark:text-white px-5 py-3 rounded-xl font-bold text-sm">Cari</button>
          </div>
        </div>

        <div id="resultCard" class="hidden bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-primary">
          <div class="flex justify-between items-start mb-3">
            <h3 id="resName" class="font-bold text-lg leading-tight">Nama Produk</h3>
            <span id="badgeProtein" class="hidden bg-yellow-100 text-yellow-700 text-xs font-bold px-2 py-1 rounded border border-yellow-300 whitespace-nowrap">💪 Tinggi Protein</span>
          </div>
          <div class="grid grid-cols-4 gap-2 text-center mb-4">
            <div class="bg-gray-50 dark:bg-gray-700 p-2 rounded-lg"><p class="text-[10px] text-gray-500">Kalori</p><p id="resCal" class="font-bold text-red-500">-</p></div>
            <div class="bg-gray-50 dark:bg-gray-700 p-2 rounded-lg"><p class="text-[10px] text-gray-500">Protein</p><p id="resPro" class="font-bold text-primary">-</p></div>
            <div class="bg-gray-50 dark:bg-gray-700 p-2 rounded-lg"><p class="text-[10px] text-gray-500">Karbo</p><p id="resCarb" class="font-bold text-blue-500">-</p></div>
            <div class="bg-gray-50 dark:bg-gray-700 p-2 rounded-lg"><p class="text-[10px] text-gray-500">Lemak</p><p id="resFat" class="font-bold text-orange-500">-</p></div>
          </div>
          <div class="flex gap-2">
            <button onclick="addToDaily()" class="flex-1 bg-primary text-white py-3 rounded-xl font-bold text-sm shadow-md">Catat Konsumsi</button>
            <button onclick="addToCompare()" class="bg-gray-200 dark:bg-gray-700 dark:text-white px-3 py-3 rounded-xl font
