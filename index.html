<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Downloader</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --container-bg: rgba(30, 41, 59, 0.75);
            --text-color: #ffffff;
            --sub-text: #94a3b8;
            --input-bg: #0f172a;
            --border-color: rgba(255, 255, 255, 0.1);
            --card-bg: #0f172a;
            --card-border: #334155;
        }

        .light-mode {
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --container-bg: rgba(255, 255, 255, 0.85);
            --text-color: #0f172a;
            --sub-text: #64748b;
            --input-bg: #f1f5f9;
            --border-color: rgba(0, 0, 0, 0.1);
            --card-bg: #ffffff;
            --card-border: #cbd5e1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        .container {
            background: var(--container-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 450px;
            text-align: center;
            position: relative;
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            color: var(--text-color);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            transition: transform 0.2s;
        }
        .theme-toggle:hover {
            transform: scale(1.1);
        }

        .brand-icon {
            font-size: 36px;
            margin-bottom: 5px;
        }
        h2 {
            margin: 0 0 5px 0;
            color: #25F4EE;
            font-size: 22px;
        }
        p.subtitle {
            color: var(--sub-text);
            font-size: 12px;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 18px;
        }
        .feature-item {
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            padding: 8px 4px;
            border-radius: 8px;
            font-size: 11px;
            color: var(--text-color);
            text-align: center;
        }
        .feature-item span {
            display: block;
            font-size: 13px;
            margin-bottom: 2px;
        }

        .input-group {
            position: relative;
            margin-bottom: 15px;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px 75px 14px 14px;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            background: var(--input-bg);
            color: var(--text-color);
            box-sizing: border-box;
            outline: none;
            font-size: 13px;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: #25F4EE;
            box-shadow: 0 0 8px rgba(37, 244, 238, 0.2);
        }

        .paste-btn {
            position: absolute;
            right: 42px;
            top: 50%;
            transform: translateY(-50%);
            background: #334155;
            color: #fff;
            border: none;
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .paste-btn:hover {
            background: #475569;
        }

        .clear-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--sub-text);
            font-size: 14px;
            cursor: pointer;
            padding: 0;
        }
        .clear-btn:hover {
            color: var(--text-color);
        }
        
        button.main-btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #fe2c55 0%, #db2777 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: opacity 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        button.main-btn:hover {
            opacity: 0.9;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
            display: inline-block;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #resultDiv {
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
            text-align: left;
        }
        .media-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
            text-align: center;
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .media-card img, .media-card video {
            width: 100%;
            max-height: 220px;
            border-radius: 8px;
            object-fit: contain;
            margin-bottom: 8px;
            background: #000;
        }
