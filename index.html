<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok & Instagram All-in-One Downloader</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h2 {
            margin-bottom: 5px;
            color: #25F4EE;
        }
        p.subtitle {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .input-group {
            position: relative;
            margin-bottom: 15px;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px 40px 14px 14px;
            border: 1px solid #475569;
            border-radius: 8px;
            background: #0f172a;
            color: #fff;
            box-sizing: border-box;
            outline: none;
            font-size: 14px;
        }
        input[type="text"]:focus {
            border-color: #25F4EE;
        }
        .clear-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 16px;
            cursor: pointer;
            padding: 0;
            width: auto;
        }
        .clear-btn:hover {
            color: #fff;
        }
        button.main-btn {
            width: 100%;
            padding: 14px;
            background: #fe2c55;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button.main-btn:hover {
            background: #e0244c;
        }
        #resultDiv {
            margin-top: 25px;
            max-height: 450px;
            overflow-y: auto;
            text-align: left;
        }
        .media-card {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 20px;
            text-align: center;
        }
        .media-card img, .media-card video {
            width: 100%;
            max-height: 280px;
            border-radius: 6px;
            object-fit: contain;
            margin-bottom: 10px;
            background: #000;
        }
        .btn-download {
            display: block;
            width: 100%;
            padding: 10px;
            background: #25F4EE;
            color: #0f172a;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            box-sizing: border-box;
            text-align: center;
            margin-bottom: 8px;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-download:hover {
            background: #1ddad5;
        }
        .btn-audio {
            background: #a855f7;
            color: #fff;
        }
        .badge {
            display: inline-block;
            background: #334155;
            color: #25F4EE;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 4px;
            margin-bottom: 8px;
        }
        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #64748b;
            border-top: 1px solid #334155;
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>AIO Downloader</h2>
        <p class="subtitle">TikTok & Instagram Downloader.<br><i>Tempel tautan dari aplikasi resmi.</i></p>
        
        <div class="input-group">
            <input type="text" id="urlInput" placeholder="Tempel link TikTok / IG...">
            <button class="clear-btn" onclick="clearInput()" title="Hapus teks">✕</button>
        </div>
        <button class="main-btn" id="btnProcess" onclick="prosesEkstrak()">Proses & Ambil Media</button>
        
        <div id="resultDiv"></div>

        <div class="footer">
            Created with ⚡ for Fast & Clean Downloading
        </div>
    </div>

    <script>
        function clearInput() {
            document.getElementById('urlInput').value = '';
            document.getElementById('urlInput').focus();
        }

        async function downloadFile(fileUrl, filename) {
            try {
                alert("Mengunduh file, mohon tunggu sebentar...");
                const response = await fetch(fileUrl);
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = blobUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                
                window.URL.revokeObjectURL(blobUrl);
                document.body.removeChild(a);
            } catch (error) {
                console.error("Gagal mendownload otomatis...", error);
                window.open(fileUrl, '_blank');
            }
        }

        async function prosesEkstrak() {
            const urlTarget = document.getElementById('urlInput').value.trim();
            const btn = document.getElementById('btnProcess');
            const resultDiv = document.getElementById('resultDiv');

            if (!urlTarget) {
                alert("Masukkan link terlebih dahulu!");
                return;
            }

            btn.innerText = "Memproses Media...";
            btn.disabled = true;
            resultDiv.innerHTML = "";

            try {
                if (urlTarget.includes('tiktok.com')) {
                    const apiURL = `https://www.tikwm.com/api/?url=${encodeURIComponent(urlTarget)}`;
                    const response = await fetch(apiURL);
                    const result = await response.json();

                    if (result.code === 0 && result.data) {
                        let htmlContent = "";
                        if (result.data.images && result.data.images.length > 0) {
                            result.data.images.forEach((imgUrl, index) => {
                                htmlContent += `
                                    <div class="media-card">
                                        <div class="badge">TikTok Foto Slide ${index + 1}</div>
                                        <img src="${imgUrl}" alt="Slide ${index + 1}">
                                        <button class="btn-download" onclick="downloadFile('${imgUrl}', 'tiktok_foto_${index + 1}.jpg')">Download Foto ${index + 1}</button>
                                    </div>
                                `;
                            });
                        } else if (result.data.play) {
                            htmlContent += `
                                <div class="media-card">
                                    <div class="badge">Video TikTok</div>
                                    <video controls src="${result.data.play}"></video>
                                    <button class="btn-download" onclick="downloadFile('${result.data.play}', 'tiktok_video.mp4')">Download Video (HD)</button>
                                    ${result.data.music ? `<button class="btn-download btn-audio" onclick="downloadFile('${result.data.music}', 'tiktok_audio.mp3')">Download Audio (MP3)</button>` : ''}
                                </div>
                            `;
                        }
                        resultDiv.innerHTML = htmlContent;
                    } else {
                        alert("Gagal mengambil data TikTok.");
                    }
                } 
                else if (urlTarget.includes('instagram.com')) {
                    // Menggunakan endpoint alternatif api.siputzx.my.id untuk Instagram
                    const apiURL = `https://api.siputzx.my.id/api/s/igdl?url=${encodeURIComponent(urlTarget)}`;
                    const response = await fetch(apiURL);
                    const result = await response.json();

                    if (result && result.status && result.data && result.data.length > 0) {
                        let htmlContent = "";
                        result.data.forEach((mediaUrl, index) => {
                            let isVideo = mediaUrl.includes('.mp4') || mediaUrl.includes('video');
                            let ext = isVideo ? 'mp4' : 'jpg';
                            htmlContent += `
                                <div class="media-card">
                                    <div class="badge">Instagram ${isVideo ? 'Video' : 'Foto'} ${index + 1}</div>
                                    ${isVideo ? `<video controls src="${mediaUrl}"></video>` : `<img src="${mediaUrl}" alt="IG Media ${index + 1}">`}
                                    <button class="btn-download" onclick="downloadFile('${mediaUrl}', 'instagram_media_${index + 1}.${ext}')">Download ${isVideo ? 'Video' : 'Foto'} Ini</button>
                                </div>
                            `;
                        });
                        resultDiv.innerHTML = htmlContent;
                    } else {
                        alert("Gagal memproses link Instagram. Pastikan link publik dan tidak diprivate!");
                    }
                } 
                else {
                    alert("Link tidak dikenali! Masukkan link TikTok atau Instagram yang valid.");
                }
            } catch (error) {
                console.error("Kesalahan:", error);
                alert("Terjadi kendala jaringan atau masalah pada server downloader.");
            } finally {
                btn.innerText = "Proses & Ambil Media";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
