<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NutriScan - Indomaret Edition</title>
  <link rel="manifest" href="manifest.json">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { primary: '#10b981' } } }
    }
  </script>
  <style>
    body { transition: background-color 0.3s, color 0.3s; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-gray-900 dark:text-gray-100 pb-20">

  <!-- Header -->
  <header class="bg-white dark:bg-gray-800 shadow-sm sticky top-0 z-50">
    <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-2">
        <div class="bg-primary text-white p-2 rounded-lg">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        </div>
        <h1 class="font-bold text-xl text-primary">NutriScan</h1>
      </div>
      <div class="flex items-center gap-3">
        <!-- Streak Challenge -->
        <div class="flex items-center text-orange-500 font-bold bg-orange-100 dark:bg-gray-700 px-2 py-1 rounded-full text-sm">
          🔥 <span id="streakCount">0</span> Hari
        </div>
        <!-- Dark Mode Toggle -->
        <button id="themeToggle" class="p-2 bg-gray-100 dark:bg-gray-700 rounded-full">
          🌙
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 mt-4 space-y-6">

    <!-- Target Harian & Progress -->
    <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border dark:border-gray-700">
      <div class="flex justify-between items-center mb-2">
        <h2 class="font-bold">Target Hari Ini</h2>
        <button onclick="toggleCalc()" class="text-xs text-primary bg-green-50 dark:bg-gray-700 px-2 py-1 rounded">Hitung Kebutuhan</button>
      </div>
      
      <!-- Calculator Modal (Hidden) -->
      <div id="calcBox" class="hidden mb-4 p-3 bg-gray-50 dark:bg-gray-700 rounded-xl text-sm">
        <p class="font-bold mb-2">Kalkulator Kalori & Protein</p>
        <div class="grid grid-cols-2 gap-2 mb-2">
          <input type="number" id="calcWeight" placeholder="Berat (kg)" class="p-2 rounded border dark:bg-gray-800 dark:border-gray-600 w-full">
          <input type="number" id="calcHeight" placeholder="Tinggi (cm)" class="p-2 rounded border dark:bg-gray-800 dark:border-gray-600 w-full">
        </div>
        <button onclick="calculateTDEE()" class="w-full bg-primary text-white rounded p-2 font-bold">Simpan Target</button>
      </div>

      <div>
        <div class="flex justify-between text-sm mb-1">
          <span>Kalori</span>
          <span id="calText" class="font-bold text-primary">0 / 2000 kcal</span>
        </div>
        <div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2.5 mb-3">
          <div id="calBar" class="bg-primary h-2.5 rounded-full" style="width: 0%"></div>
        </div>
        <div class="flex justify-between text-sm mb-1">
          <span>Protein</span>
          <span id="proText" class="font-bold text-blue-500">0 / 80 g</span>
        </div>
        <div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2.5">
          <div id="proBar" class="bg-blue-500 h-2.5 rounded-full" style="width: 0%"></div>
        </div>
      </div>
    </div>

    <!-- Scanner / Input Barcode -->
    <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border dark:border-gray-700">
      <h2 class="font-bold mb-3">Scan atau Cari Produk</h2>
      <div class="flex gap-2">
        <input type="text" id="barcodeInput" placeholder="Masukkan Barcode / Nama" class="flex-1 border dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-xl px-4 py-2 focus:outline-none focus:ring-2 focus:ring-primary">
        <button onclick="searchProduct()" class="bg-primary text-white px-4 py-2 rounded-xl font-bold">Cari</button>
      </div>
    </div>

    <!-- Product Result Card -->
    <div id="resultCard" class="hidden bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-primary">
      <div class="flex justify-between items-start mb-3">
        <h3 id="resName" class="font-bold text-lg leading-tight">Nama Produk</h3>
        <span id="badgeProtein" class="hidden bg-yellow-100 text-yellow-700 text-xs font-bold px-2 py-1 rounded border border-yellow-300">💪 Tinggi Protein</span>
      </div>
      <div class="grid grid-cols-4 gap-2 text-center mb-4">
        <div class="bg-gray-50 dark:bg-gray-700 p-2 rounded-lg"><p class="text-xs text-gray-500 dark:text-gray-400">Kalori</p><p id="resCal" class="font-bold text-red-500">-</p></div>
        <div class="bg-gray-50 dark:bg-gray-700 p-2 rounded-lg"><p class="text-xs text-gray-500 dark:text-gray-400">Protein</p><p id="resPro" class="font-bold text-primary">-</p></div>
        <div class="bg-gray-50 dark:bg-gray-700 p-2 rounded-lg"><p class="text-xs text-gray-500 dark:text-gray-400">Karbo</p><p id="resCarb" class="font-bold text-blue-500">-</p></div>
        <div class="bg-gray-50 dark:bg-gray-700 p-2 rounded-lg"><p class="text-xs text-gray-500 dark:text-gray-400">Lemak</p><p id="resFat" class="font-bold text-orange-500">-</p></div>
      </div>
      <div class="flex gap-2">
        <button onclick="addToDaily()" class="flex-1 bg-primary text-white py-2 rounded-xl font-bold text-sm">Catat Konsumsi</button>
        <button onclick="addToCompare()" class="bg-gray-200 dark:bg-gray-700 dark:text-white px-3 py-2 rounded-xl font-bold text-sm">Bandingkan</button>
      </div>
    </div>

    <!-- Comparison Section -->
    <div id="compareSection" class="hidden bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border dark:border-gray-700">
      <div class="flex justify-between items-center mb-3">
        <h2 class="font-bold">Perbandingan Produk</h2>
        <button onclick="clearCompare()" class="text-xs text-red-500">Hapus</button>
      </div>
      <div id="compareGrid" class="grid grid-cols-2 gap-2 text-sm">
        <!-- Injected via JS -->
      </div>
    </div>

    <!-- Grafik & Ekspor -->
    <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border dark:border-gray-700">
      <div class="flex justify-between items-center mb-4">
        <h2 class="font-bold">Grafik 7 Hari Terakhir</h2>
        <button onclick="exportWA()" class="bg-green-500 text-white text-xs px-3 py-1 rounded-full flex items-center gap-1 font-bold">
          Ekspor ke WA
        </button>
      </div>
      <canvas id="weeklyChart" width="400" height="200"></canvas>
    </div>

  </main>

  <script>
    // 1. Database Produk (Ditambah produk tinggi protein & gampang dicari)
    const database = {
      // Snack & Roti
      "8997001430018": { name: "Sari Roti Tawar Spesial (350g)", cal: 900, pro: 24, carb: 160, fat: 14 },
      "8992753033102": { name: "SilverQueen Chunky Bar", cal: 170, pro: 3, carb: 18, fat: 10 },
      "8998000000201": { name: "Fitbar Multigrain", cal: 90, pro: 2, carb: 15, fat: 3 },
      "8999000000002": { name: "Soyjoy Crispy", cal: 130, pro: 4, carb: 15, fat: 6 },
      // Susu & Protein
      "8992753011018": { name: "Ultra Milk Low Fat (250ml)", cal: 110, pro: 8, carb: 15, fat: 2 },
      "8996001600207": { name: "L-Men 2Go (200ml)", cal: 140, pro: 12, carb: 18, fat: 3 },
      "8991000000003": { name: "Cimory Yogurt Squeeze", cal: 120, pro: 4, carb: 20, fat: 3 },
      "8999999033411": { name: "Bear Brand (189ml)", cal: 120, pro: 6, carb: 9, fat: 7 },
      // Makanan Gym Minimarket
      "2000000000001": { name: "Telur Rebus Indomaret (2 btr)", cal: 155, pro: 12, carb: 1, fat: 10 },
      "2000000000002": { name: "Edamame Rebus Indomaret", cal: 120, pro: 11, carb: 10, fat: 5 },
      "2000000000003": { name: "Dada Ayam Goreng (Bento)", cal: 250, pro: 25, carb: 5, fat: 12 },
      // Minuman Ringan
      "8997033810017": { name: "Le Minerale (600ml)", cal: 0, pro: 0, carb: 0, fat: 0 },
      "8991388102123": { name: "Aqua Air Mineral (600ml)", cal: 0, pro: 0, carb: 0, fat: 0 }
    };

    // State Variables
    let today = new Date().toISOString().split('T')[0];
    let dailyLog = JSON.parse(localStorage.getItem('dailyLog')) || { cal: 0, pro: 0, carb: 0, fat: 0, date: today };
    let targets = JSON.parse(localStorage.getItem('targets')) || { cal: 2000, pro: 85 }; // Default target protein 85g
    let currentScanned = null;
    let compareList = [];

    // 2. Inisialisasi Aplikasi
    function initApp() {
      checkStreak();
      checkNewDay();
      updateProgress();
      setupTheme();
      renderChart();
    }

    // 3. Mode Gelap Terang
    function setupTheme() {
      const toggle = document.getElementById('themeToggle');
      if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.classList.add('dark');
        toggle.innerText = '☀️';
      }
      toggle.addEventListener('click', () => {
        document.documentElement.classList.toggle('dark');
        if (document.documentElement.classList.contains('dark')) {
          localStorage.setItem('theme', 'dark');
          toggle.innerText = '☀️';
        } else {
          localStorage.setItem('theme', 'light');
          toggle.innerText = '🌙';
        }
      });
    }

    // 4. Mode Tantangan (Streak)
    function checkStreak() {
      let streak = parseInt(localStorage.getItem('streak') || 0);
      let lastLogin = localStorage.getItem('lastLogin');
      
      let yesterday = new Date();
      yesterday.setDate(yesterday.getDate() - 1);
      let yesterdayStr = yesterday.toISOString().split('T')[0];

      if (lastLogin === yesterdayStr) {
        streak++;
      } else if (lastLogin !== today) {
        streak = 1; // Reset jika bolong
      }
      
      localStorage.setItem('streak', streak);
      localStorage.setItem('lastLogin', today);
      document.getElementById('streakCount').innerText = streak;
    }

    function checkNewDay() {
      if (dailyLog.date !== today) {
        // Simpan data kemarin ke history chart
        let history = JSON.parse(localStorage.getItem('history')) || [];
        history.push({ date: dailyLog.date, cal: dailyLog.cal, pro: dailyLog.pro });
        if (history.length > 7) history.shift();
        localStorage.setItem('history', JSON.stringify(history));
        
        // Reset harian
        dailyLog = { cal: 0, pro: 0, carb: 0, fat: 0, date: today };
        localStorage.setItem('dailyLog', JSON.stringify(dailyLog));
      }
    }

    // 5. Pencarian & Badge Protein
    function searchProduct() {
      const input = document.getElementById('barcodeInput').value.toLowerCase();
      let found = database[input];

      // Fitur cari berdasarkan nama juga!
      if (!found) {
        for (let key in database) {
          if (database[key].name.toLowerCase().includes(input)) {
            found = database[key];
            break;
          }
        }
      }

      if (found) {
        currentScanned = found;
        document.getElementById('resName').innerText = found.name;
        document.getElementById('resCal').innerText = found.cal;
        document.getElementById('resPro').innerText = found.pro + "g";
        document.getElementById('resCarb').innerText = found.carb + "g";
        document.getElementById('resFat').innerText = found.fat + "g";
        
        // Menampilkan Lencana "Tinggi Protein" jika protein >= 10g
        const badge = document.getElementById('badgeProtein');
        if (found.pro >= 10) {
          badge.classList.remove('hidden');
        } else {
          badge.classList.add('hidden');
        }

        document.getElementById('resultCard').classList.remove('hidden');
      } else {
        alert("Produk tidak ditemukan! Coba masukkan kata kunci yang lebih spesifik.");
      }
    }

    function addToDaily() {
      if (!currentScanned) return;
      dailyLog.cal += currentScanned.cal;
      dailyLog.pro += currentScanned.pro;
      dailyLog.carb += currentScanned.carb;
      dailyLog.fat += currentScanned.fat;
      localStorage.setItem('dailyLog', JSON.stringify(dailyLog));
      updateProgress();
      document.getElementById('resultCard').classList.add('hidden');
      document.getElementById('barcodeInput').value = '';
      alert(`${currentScanned.name} berhasil dicatat!`);
    }

    // 6. Progress Target Harian
    function updateProgress() {
      const calPercent = Math.min((dailyLog.cal / targets.cal) * 100, 100);
      const proPercent = Math.min((dailyLog.pro / targets.pro) * 100, 100);
      
      document.getElementById('calBar').style.width = calPercent + "%";
      document.getElementById('proBar').style.width = proPercent + "%";
      
      document.getElementById('calText').innerText = `${dailyLog.cal} / ${targets.cal} kcal`;
      document.getElementById('proText').innerText = `${dailyLog.pro} / ${targets.pro} g`;
    }

    // Kalkulator TDEE Sederhana
    function toggleCalc() {
      document.getElementById('calcBox').classList.toggle('hidden');
    }

    function calculateTDEE() {
      const weight = document.getElementById('calcWeight').value;
      const height = document.getElementById('calcHeight').value;
      if (weight && height) {
        // Rumus sederhana TDEE
        const bmr = (10 * weight) + (6.25 * height) - (5 * 16) + 5; // Asumsi laki-laki umur 16th
        const tdee = Math.round(bmr * 1.55); // Aktivitas moderat (gym)
        const proTarget = Math.round(weight * 1.8); // 1.8g protein per kg berat badan
        
        targets = { cal: tdee, pro: proTarget };
        localStorage.setItem('targets', JSON.stringify(targets));
        updateProgress();
        toggleCalc();
        alert(`Target harian diperbarui!\nKalori: ${tdee} kcal\nProtein: ${proTarget} g`);
      }
    }

    // 7. Bandingkan Produk
    function addToCompare() {
      if (!currentScanned) return;
      if (compareList.length >= 2) {
        alert("Maksimal bandingkan 2 produk!");
        return;
      }
      compareList.push(currentScanned);
      renderCompare();
      document.getElementById('resultCard').classList.add('hidden');
    }

    function renderCompare() {
      const grid = document.getElementById('compareGrid');
      const section = document.getElementById('compareSection');
      if (compareList.length === 0) {
        section.classList.add('hidden');
        return;
      }
      
      section.classList.remove('hidden');
      grid.innerHTML = '';
      
      compareList.forEach(item => {
        grid.innerHTML += `
          <div class="bg-gray-50 dark:bg-gray-700 p-2 rounded-lg border dark:border-gray-600">
            <p class="font-bold text-xs truncate">${item.name}</p>
            <p class="text-xs mt-1">Kal: ${item.cal} | Pro: <span class="text-primary font-bold">${item.pro}g</span></p>
          </div>
        `;
      });
    }

    function clearCompare() {
      compareList = [];
      renderCompare();
    }

    // 8. Ekspor ke WhatsApp
    function exportWA() {
      const text = `*Catatan Nutrisi Hari Ini (NutriScan)*\n🔥 Streak: ${localStorage.getItem('streak')} Hari\n\n📊 Total Kalori: ${dailyLog.cal} / ${targets.cal} kcal\n💪 Total Protein: ${dailyLog.pro} / ${targets.pro} g\n\nSemangat penuhi target!`;
      const waLink = `https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`;
      window.open(waLink, '_blank');
    }

    // 9. Grafik Mingguan Chart.js
    function renderChart() {
      let history = JSON.parse(localStorage.getItem('history')) || [];
      // Buat data tiruan jika history kosong agar chart terlihat bagus
      if (history.length === 0) {
        history = [
          { date: "H-4", cal: 1800, pro: 70 },
          { date: "H-3", cal: 2100, pro: 85 },
          { date: "H-2", cal: 1950, pro: 80 },
          { date: "H-1", cal: 2050, pro: 90 }
        ];
      }
      
      const labels = history.map(h => h.date);
      const calData = history.map(h => h.cal);
      const proData = history.map(h => h.pro);

      const ctx = document.getElementById('weeklyChart').getContext('2d');
      new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [
            {
              label: 'Protein (g)',
              data: proData,
              backgroundColor: '#3b82f6',
              type: 'line',
              tension: 0.3
            },
            {
              label: 'Kalori (kcal)',
              data: calData,
              backgroundColor: '#10b981',
              borderRadius: 4
            }
          ]
        },
        options: {
          responsive: true,
          scales: { y: { beginAtZero: true } }
        }
      });
    }

    // Jalankan saat web dimuat
    initApp();
  </script>
</body>
</html>
