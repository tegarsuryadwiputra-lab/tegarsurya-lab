<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIO Media Downloader - TikTok, YouTube & Music</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 480px;
            text-align: center;
        }
        h2 {
            margin-bottom: 5px;
            color: #25F4EE;
        }
        p.subtitle {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .section-box {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 25px;
            text-align: left;
        }
        .section-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .input-group {
            position: relative;
            margin-bottom: 12px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px 35px 12px 12px;
            border: 1px solid #475569;
            border-radius: 8px;
            background: #1e293b;
            color: #fff;
            box-sizing: border-box;
            outline: none;
            font-size: 13px;
        }
        input[type="text"]:focus {
            border-color: #25F4EE;
        }
        .clear-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 14px;
            cursor: pointer;
            padding: 0;
        }
        .clear-btn:hover {
            color: #fff;
        }
        button.action-btn {
            width: 100%;
            padding: 12px;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button.action-btn:hover {
            opacity: 0.9;
        }
        .btn-tiktok { background: #fe2c55; }
        .btn-youtube { background: #ff0000; }
        .btn-music { background: #a855f7; }

        .result-area {
            margin-top: 15px;
        }
        .media-card {
            background: #1e293b;
            border: 1px solid #475569;
            border-radius: 8px;
            padding: 10px;
            margin-top: 10px;
            text-align: center;
        }
        .media-card img, .media-card video {
            width: 100%;
            max-height: 220px;
            border-radius: 6px;
            object-fit: contain;
            margin-bottom: 8px;
            background: #000;
        }
        .btn-download {
            display: block;
            width: 100%;
            padding: 9px;
            background: #25F4EE;
            color: #0f172a;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
            box-sizing: border-box;
            text-align: center;
            margin-bottom: 6px;
            border: none;
            cursor: pointer;
        }
        .btn-download:hover {
            background: #1ddad5;
        }
        .btn-hd {
            background: #ff0050;
            color: #fff;
        }
        .badge {
            display: inline-block;
            background: #334155;
            color: #25F4EE;
            font-size: 11px;
            padding: 3px 6px;
            border-radius: 4px;
            margin-bottom: 6px;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #64748b;
            border-top: 1px solid #334155;
            padding-top: 12px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>AIO Downloader</h2>
        <p class="subtitle">TikTok, YouTube & Music Downloader.<br><i>Tempel tautan sesuai kategorinya.</i></p>
        
        <!-- BAGIAN 1: TIKTOK -->
        <div class="section-box">
            <div class="section-title">🎵 TikTok Downloader</div>
            <div class="input-group">
                <input type="text" id="tiktokInput" placeholder="Tempel link TikTok di sini...">
                <button class="clear-btn" onclick="clearField('tiktokInput')">✕</button>
            </div>
            <button class="action-btn btn-tiktok" id="btnTikTok" onclick="prosesTikTok()">Proses TikTok</button>
            <div id="tiktokResult" class="result-area"></div>
        </div>

        <!-- BAGIAN 2: YOUTUBE -->
        <div class="section-box">
            <div class="section-title">▶️ YouTube Video Downloader (HD)</div>
            <div class="input-group">
                <input type="text" id="ytInput" placeholder="Tempel link YouTube (Video / Shorts)...">
                <button class="clear-btn" onclick="clearField('ytInput')">✕</button>
            </div>
            <button class="action-btn btn-youtube" id="btnYouTube" onclick="prosesYouTube()">Proses YouTube</button>
            <div id="ytResult" class="result-area"></div>
        </div>

        <!-- BAGIAN 3: YOUTUBE MUSIC -->
        <div class="section-box">
            <div class="section-title">🎧 YouTube Music / Audio Downloader</div>
            <div class="input-group">
                <input type="text" id="musicInput" placeholder="Tempel link YouTube Music...">
                <button class="clear-btn" onclick="clearField('musicInput')">✕</button>
            </div>
            <button class="action-btn btn-music" id="btnMusic" onclick="prosesMusic()">Proses Musik (MP3)</button>
            <div id="musicResult" class="result-area"></div>
        </div>

        <div class="footer">
            Created with ⚡ for Fast & Clean Downloading
        </div>
    </div>

    <script>
        function clearField(id) {
            document.getElementById(id).value = '';
            document.getElementById(id).focus();
        }

        async function downloadFile(fileUrl, filename) {
            try {
                alert("Mengunduh file, mohon tunggu sebentar...");
                const response = await fetch(fileUrl);
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = blobUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                
                window.URL.revokeObjectURL(blobUrl);
                document.body.removeChild(a);
            } catch (error) {
                console.error("Gagal mendownload otomatis, membuka tautan cadangan...", error);
                window.open(fileUrl, '_blank');
            }
        }

        // FUNGSI TIKTOK
        async function prosesTikTok() {
            const urlTarget = document.getElementById('tiktokInput').value.trim();
            const btn = document.getElementById('btnTikTok');
            const resultDiv = document.getElementById('tiktokResult');

            if (!urlTarget) { alert("Masukkan link TikTok terlebih dahulu!"); return; }
            if (!urlTarget.includes('tiktok.com')) { alert("Link bukan tautan TikTok yang valid!"); return; }

            btn.innerText = "Memproses...";
            btn.disabled = true;
            resultDiv.innerHTML = "";

            try {
                const apiURL = `https://www.tikwm.com/api/?url=${encodeURIComponent(urlTarget)}&hd=1`;
                const response = await fetch(apiURL);
                const result = await response.json();

                if (result.code === 0 && result.data) {
                    let htmlContent = "";
                    if (result.data.images && result.data.images.length > 0) {
                        result.data.images.forEach((imgUrl, index) => {
                            htmlContent += `
                                <div class="media-card">
                                    <div class="badge">Foto Slide ${index + 1}</div>
                                    <img src="${imgUrl}" alt="Slide ${index + 1}">
                                    <button class="btn-download" onclick="downloadFile('${imgUrl}', 'tiktok_foto_${index + 1}.jpg')">Download Foto</button>
                                </div>
                            `;
                        });
                    } else if (result.data.play) {
                        let videoHD = result.data.hdplay || result.data.play;
                        let videoNormal = result.data.play;

                        htmlContent += `
                            <div class="media-card">
                                <div class="badge">Video TikTok HD</div>
                                <video controls src="${videoHD}"></video>
                                <button class="btn-download btn-hd" onclick="downloadFile('${videoHD}', 'tiktok_HD.mp4')">🔥 Download Video HD (1080p)</button>
                                ${videoHD !== videoNormal ? `<button class="btn-download" onclick="downloadFile('${videoNormal}', 'tiktok_SD.mp4')">Download Standar</button>` : ''}
                                ${result.data.music ? `<button class="btn-download" style="background:#a855f7; color:#fff;" onclick="downloadFile('${result.data.music}', 'tiktok_audio.mp3')">Download Audio MP3</button>` : ''}
                            </div>
                        `;
                    }
                    resultDiv.innerHTML = htmlContent;
                } else {
                    alert("Gagal mengambil data TikTok.");
                }
            } catch (error) {
                alert("Terjadi kendala jaringan pada TikTok.");
            } finally {
                btn.innerText = "Proses TikTok";
                btn.disabled = false;
            }
        }

        // FUNGSI YOUTUBE
        async function prosesYouTube() {
            const urlTarget = document.getElementById('ytInput').value.trim();
            const btn = document.getElementById('btnYouTube');
            const resultDiv = document.getElementById('ytResult');

            if (!urlTarget) { alert("Masukkan link YouTube terlebih dahulu!"); return; }
            if (!urlTarget.includes('youtube.com') && !urlTarget.includes('youtu.be')) { alert("Link bukan tautan YouTube yang valid!"); return; }

            btn.innerText = "Memproses...";
            btn.disabled = true;
            resultDiv.innerHTML = "";

            try {
                const apiURL = `https://api.siputzx.my.id/api/s/youtube?url=${encodeURIComponent(urlTarget)}`;
                const response = await fetch(apiURL);
                const result = await response.json();

                if (result && result.status && result.data) {
                    let data = result.data;
                    let title = data.title || "youtube_video";
                    let thumb = data.thumbnail || "";
                    let dlUrl = data.url || data.dl || (data.video && data.video[0] ? data.video[0].url : "");

                    if (dlUrl) {
                        resultDiv.innerHTML = `
                            <div class="media-card">
                                <div class="badge">YouTube HD Video</div>
                                ${thumb ? `<img src="${thumb}" alt="Thumbnail">` : ''}
                                <p style="font-size:12px; margin: 6px 0; color:#cbd5e1;"><b>${title}</b></p>
                                <button class="btn-download btn-hd" onclick="downloadFile('${dlUrl}', 'youtube_video_HD.mp4')">🔥 Download Video HD (1080p/720p)</button>
                            </div>
                        `;
                    } else {
                        alert("Gagal menemukan link download video YouTube.");
                    }
                } else {
                    alert("Gagal memproses YouTube. Pastikan link benar!");
                }
            } catch (error) {
                alert("Terjadi kendala jaringan pada server YouTube.");
            } finally {
                btn.innerText = "Proses YouTube";
                btn.disabled = false;
            }
        }

        // FUNGSI YOUTUBE MUSIC
        async function prosesMusic() {
            const urlTarget = document.getElementById('musicInput').value.trim();
            const btn = document.getElementById('btnMusic');
            const resultDiv = document.getElementById('musicResult');

            if (!urlTarget) { alert("Masukkan link YouTube Music terlebih dahulu!"); return; }
            if (!urlTarget.includes('youtube.com') && !urlTarget.includes('youtu.be') && !urlTarget.includes('music.youtube.com')) { alert("Link tidak valid!"); return; }

            btn.innerText = "Memproses Audio...";
            btn.disabled = true;
            resultDiv.innerHTML = "";

            try {
                // Menggunakan endpoint audio/mp3 converter publik
                const apiURL = `https://api.siputzx.my.id/api/s/youtube?url=${encodeURIComponent(urlTarget)}`;
                const response = await fetch(apiURL);
                const result = await response.json();

                if (result && result.status && result.data) {
                    let data = result.data;
                    let title = data.title || "youtube_audio";
                    let thumb = data.thumbnail || "";
                    let audioUrl = data.audio || data.dl_audio || data.url;

                    if (audioUrl) {
                        resultDiv.innerHTML = `
                            <div class="media-card">
                                <div class="badge">YouTube Music (MP3)</div>
                                ${thumb ? `<img src="${thumb}" alt="Thumbnail" style="max-height:140px;">` : ''}
                                <p style="font-size:12px; margin: 6px 0; color:#cbd5e1;"><b>${title}</b></p>
                                <button class="btn-download" style="background:#a855f7; color:#fff;" onclick="downloadFile('${audioUrl}', '${title.replace(/[^a-zA-Z0-9]/g, '_')}.mp3')">🎵 Download Audio MP3 (High Quality)</button>
                            </div>
                        `;
                    } else {
                        alert("Gagal mengekstrak audio dari link tersebut.");
                    }
                } else {
                    alert("Gagal memproses YouTube Music.");
                }
            } catch (error) {
                alert("Terjadi kendala jaringan pada server musik.");
            } finally {
                btn.innerText = "Proses Musik (MP3)";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
