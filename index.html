<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Downloader</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --container-bg: rgba(30, 41, 59, 0.75);
            --text-color: #ffffff;
            --sub-text: #94a3b8;
            --input-bg: #0f172a;
            --border-color: rgba(255, 255, 255, 0.1);
            --card-bg: #0f172a;
            --card-border: #334155;
        }

        .light-mode {
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --container-bg: rgba(255, 255, 255, 0.85);
            --text-color: #0f172a;
            --sub-text: #64748b;
            --input-bg: #f1f5f9;
            --border-color: rgba(0, 0, 0, 0.1);
            --card-bg: #ffffff;
            --card-border: #cbd5e1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        .container {
            background: var(--container-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 450px;
            text-align: center;
            position: relative;
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            color: var(--text-color);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            transition: transform 0.2s;
        }
        .theme-toggle:hover {
            transform: scale(1.1);
        }

        .brand-icon {
            font-size: 36px;
            margin-bottom: 5px;
        }
        h2 {
            margin: 0 0 5px 0;
            color: #25F4EE;
            font-size: 22px;
        }
        p.subtitle {
            color: var(--sub-text);
            font-size: 12px;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 18px;
        }
        .feature-item {
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            padding: 8px 4px;
            border-radius: 8px;
            font-size: 11px;
            color: var(--text-color);
            text-align: center;
        }
        .feature-item span {
            display: block;
            font-size: 13px;
            margin-bottom: 2px;
        }

        .input-group {
            position: relative;
            margin-bottom: 15px;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px 75px 14px 14px;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            background: var(--input-bg);
            color: var(--text-color);
            box-sizing: border-box;
            outline: none;
            font-size: 13px;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: #25F4EE;
            box-shadow: 0 0 8px rgba(37, 244, 238, 0.2);
        }

        .paste-btn {
            position: absolute;
            right: 42px;
            top: 50%;
            transform: translateY(-50%);
            background: #334155;
            color: #fff;
            border: none;
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .paste-btn:hover {
            background: #475569;
        }

        .clear-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--sub-text);
            font-size: 14px;
            cursor: pointer;
            padding: 0;
        }
        .clear-btn:hover {
            color: var(--text-color);
        }
        
        button.main-btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #fe2c55 0%, #db2777 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: opacity 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        button.main-btn:hover {
            opacity: 0.9;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
            display: inline-block;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #resultDiv {
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
            text-align: left;
        }
        .media-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
            text-align: center;
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .media-card img, .media-card video {
            width: 100%;
            max-height: 220px;
            border-radius: 8px;
            object-fit: contain;
            margin-bottom: 8px;
            background: #000;
        }
        .btn-download {
            display: block;
            width: 100%;
            padding: 10px;
            background: #25F4EE;
            color: #0f172a;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 12px;
            box-sizing: border-box;
            text-align: center;
            margin-bottom: 6px;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-download:hover {
            background: #1ddad5;
        }
        .btn-hd {
            background: linear-gradient(135deg, #fe2c55 0%, #ff0050 100%);
            color: #fff;
        }
        .btn-audio {
            background: linear-gradient(135deg, #a855f7 0%, #7c3aed 100%);
            color: #fff;
        }
        .btn-copy {
            background: #334155;
            color: #fff;
        }
        .btn-copy:hover {
            background: #475569;
        }
        .badge {
            display: inline-block;
            background: var(--input-bg);
            color: #25F4EE;
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 6px;
            margin-bottom: 8px;
            border: 1px solid var(--card-border);
        }

        .history-section {
            margin-top: 25px;
            text-align: left;
            border-top: 1px solid var(--card-border);
            padding-top: 15px;
        }
        .history-title {
            font-size: 12px;
            font-weight: bold;
            color: var(--sub-text);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .clear-history {
            background: none;
            border: none;
            color: #ef4444;
            font-size: 11px;
            cursor: pointer;
        }
        .history-list {
            max-height: 120px;
            overflow-y: auto;
            font-size: 11px;
        }
        .history-item {
            background: var(--input-bg);
            padding: 6px 10px;
            border-radius: 6px;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--sub-text);
            border: 1px solid var(--card-border);
        }
        .history-item a {
            color: #25F4EE;
            text-decoration: none;
            max-width: 180px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .footer {
            margin-top: 20px;
            font-size: 11px;
            color: var(--sub-text);
            border-top: 1px solid var(--card-border);
            padding-top: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .clear-result-btn {
            background: none;
            border: none;
            color: #ef4444;
            font-size: 11px;
            cursor: pointer;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <button class="theme-toggle" id="themeBtn" onclick="toggleTheme()" title="Ganti Tema">🌙</button>

        <div class="brand-icon">🎵</div>
        <h2>TikTok Downloader</h2>
        <p class="subtitle">Unduh Video HD & Foto Slide TikTok tanpa watermark.</p>
        
        <!-- Fitur unggulan agar web tidak sepi -->
        <div class="features-grid">
            <div class="feature-item"><span>⚡</span>Tanpa Watermark</div>
            <div class="feature-item"><span>🔥</span>Kualitas HD</div>
            <div class="feature-item"><span>🎵</span>Support Audio</div>
        </div>

        <div class="input-group">
            <input type="text" id="urlInput" placeholder="Tempel tautan TikTok...">
            <button class="paste-btn" onclick="pasteClipboard()" title="Tempel Tautan">Paste</button>
            <button class="clear-btn" onclick="clearInput()" title="Hapus">✕</button>
        </div>
        
        <button class="main-btn" id="btnProcess" onclick="prosesEkstrak()">
            <span id="btnText">Proses & Ambil Media</span>
        </button>
        
        <div id="resultDiv"></div>

        <!-- Riwayat unduhan terakhir -->
        <div class="history-section" id="historySection" style="display: none;">
            <div class="history-title">
                <span>🕒 Riwayat Terakhir</span>
                <button class="clear-history" onclick="clearHistory()">Hapus Riwayat</button>
            </div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="footer">
            <span>Created with ⚡ for Fast Downloading</span>
            <button class="clear-result-btn" id="clearResultBtn" onclick="clearResults()">Bersihkan Layar</button>
        </div>
    </div>

    <script>
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            document.getElementById('themeBtn').innerText = isLight ? '☀️' : '🌙';
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('theme') === 'light') {
                document.body.classList.add('light-mode');
                document.getElementById('themeBtn').innerText = '☀️';
            }
            loadHistory();
        });

        function clearInput() {
            document.getElementById('urlInput').value = '';
            document.getElementById('urlInput').focus();
        }

        async function pasteClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                document.getElementById('urlInput').value = text;
            } catch (err) {
                alert("Gagal membaca clipboard. Tempel manual.");
            }
        }

        async function downloadFile(fileUrl, filename) {
            try {
                alert("Mengunduh file, mohon tunggu sebentar...");
                const response = await fetch(fileUrl);
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = blobUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                
                window.URL.revokeObjectURL(blobUrl);
                document.body.removeChild(a);
            } catch (error) {
                window.open(fileUrl, '_blank');
            }
        }

        function copyLink(fileUrl) {
            navigator.clipboard.writeText(fileUrl).then(() => {
                alert("Tautan unduhan berhasil disalin ke clipboard!");
            }).catch(() => {
                alert("Gagal menyalin tautan.");
            });
        }

        function clearResults() {
            document.getElementById('resultDiv').innerHTML = '';
            document.getElementById('clearResultBtn').style.display = 'none';
        }

        function saveHistory(url) {
            let history = JSON.parse(localStorage.getItem('dl_history') || '[]');
            if (!history.includes(url)) {
                history.unshift(url);
                if (history.length > 5) history.pop();
                localStorage.setItem('dl_history', JSON.stringify(history));
            }
            loadHistory();
        }

        function loadHistory() {
            let history = JSON.parse(localStorage.getItem('dl_history') || '[]');
            const historySection = document.getElementById('historySection');
            const historyList = document.getElementById('historyList');

            if (history.length > 0) {
                historySection.style.display = 'block';
                historyList.innerHTML = history.map(link => `
                    <div class="history-item">
                        <a href="#" onclick="document.getElementById('urlInput').value='${link}'; return false;" title="${link}">${link}</a>
                        <span>Tersimpan</span>
                    </div>
                `).join('');
            } else {
                historySection.style.display = 'none';
            }
        }

        function clearHistory() {
            localStorage.removeItem('dl_history');
            loadHistory();
        }

        async function prosesEkstrak() {
            const urlTarget = document.getElementById('urlInput').value.trim();
            const btn = document.getElementById('btnProcess');
            const btnText = document.getElementById('btnText');
            const resultDiv = document.getElementById('resultDiv');
            const clearResBtn = document.getElementById('clearResultBtn');

            if (!urlTarget) {
                alert("Masukkan tautan TikTok terlebih dahulu!");
                return;
            }
            if (!urlTarget.includes('tiktok.com')) {
                alert("Tautan tidak valid! Pastikan memasukkan link TikTok yang benar.");
                return;
            }

            btn.disabled = true;
            btnText.innerHTML = `<div class="spinner"></div> Sedang Memproses...`;
            resultDiv.innerHTML = "";

            try {
                const apiURL = `https://www.tikwm.com/api/?url=${encodeURIComponent(urlTarget)}&hd=1`;
                const response = await fetch(apiURL);
                const result = await response.json();

                if (result.code === 0 && result.data) {
                    saveHistory(urlTarget);
                    let htmlContent = "";
                    
                    if (result.data.images && result.data.images.length > 0) {
                        result.data.images.forEach((imgUrl, index) => {
                            htmlContent += `
                                <div class="media-card">
                                    <div class="badge">JPG - Foto Slide ${index + 1}</div>
                                    <img src="${imgUrl}" alt="Slide ${index + 1}">
                                    <button class="btn-download" onclick="downloadFile('${imgUrl}', 'tiktok_foto_${index + 1}.jpg')">Download Foto ${index + 1}</button>
                                    <button class="btn-download btn-copy" onclick="copyLink('${imgUrl}')">📋 Salin Link Foto</button>
                                </div>
                            `;
                        });
                    } else if (result.data.play) {
                        let videoHD = result.data.hdplay || result.data.play;
                        let videoNormal = result.data.play;

                        htmlContent += `
                            <div class="media-card">
                                <div class="badge">MP4 - Video HD Tanpa Watermark</div>
                                <video controls src="${videoHD}"></video>
                                <button class="btn-download btn-hd" onclick="downloadFile('${videoHD}', 'tiktok_video_HD.mp4')">🔥 Download Video HD (1080p)</button>
                                ${videoHD !== videoNormal ? `<button class="btn-download" onclick="downloadFile('${videoNormal}', 'tiktok_video_SD.mp4')">Download Versi Standar</button>` : ''}
                                ${result.data.music ? `<button class="btn-download btn-audio" onclick="downloadFile('${result.data.music}', 'tiktok_audio.mp3')">🎵 Download Musik MP3</button>` : ''}
                                <button class="btn-download btn-copy" onclick="copyLink('${videoHD}')">📋 Salin Tautan Video</button>
                            </div>
                        `;
                    }
                    resultDiv.innerHTML = htmlContent;
                    clearResBtn.style.display = 'inline-block';
                } else {
                    alert("Gagal mengambil data TikTok. Pastikan link publik dan benar!");
                }
            } catch (error) {
                alert("Terjadi kendala jaringan. Periksa koneksi internet Anda.");
            } finally {
                btn.disabled = false;
                btnText.innerText = "Proses & Ambil Media";
            }
        }
    </script>
</body>
</html>
